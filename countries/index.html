<script>
document.addEventListener('DOMContentLoaded', () => {
  const box = document.getElementById('countryGrid');
  const search = document.getElementById('countrySearch');
  const continent = document.getElementById('continentFilter');
  const db = window.countries; 

  function renderList(list) {
    box.innerHTML = '';
    list.forEach(c => {
      const div = document.createElement('div');
      div.className = 'country-card';
      div.setAttribute('onclick', `window.location.href ='/category/?c=${c.name.replaceAll(' ', '_')}&country=1'`)
      div.setAttribute('title', `${c.code}`)
      div.setAttribute('title-pos', `top`)
      div.innerHTML = `
        <img src="/assets/images/flags/${c.name.replaceAll(' ', '_')}.png" alt="${c.name}">
        <p>${c.name}</p>
      `;
      box.appendChild(div);
    });
  }

  function filterList() {
    const q = search.value.toLowerCase().trim();
    const cont = continent.value;
    const filtered = db.filter(c => 
      c.name.toLowerCase().includes(q) &&
      (cont === '' || c.continent === cont) && c.code.includes(q)
    );
    renderList(filtered);
  }

  // Initial load
  renderList(db);

  // Event listeners
  search.addEventListener('input', filterList);
  continent.addEventListener('change', filterList);
});
</script>
