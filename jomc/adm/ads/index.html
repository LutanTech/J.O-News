<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Advertisement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Prevent flicker on drag */
        #dropZone * {
            pointer-events: none;
        }
        #dropZone input, #dropZone button {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-xl shadow-lg overflow-hidden">
        <div class="bg-blue-600 p-6 text-center">
            <h2 class="text-2xl font-bold text-white">New Advertisement</h2>
            <p class="text-blue-100 mt-1">Upload details and creatives</p>
        </div>

        <div class="p-8">
            <form id="adForm" class="space-y-6">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ad Title</label>
                    <input type="text" id="title" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="e.g., Summer Sale 2024">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Creative Image</label>
                    <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition-colors cursor-pointer group" id="dropZone">
                        <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                        
                        <div id="uploadPlaceholder" class="space-y-2 transition-opacity duration-200">
                            <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 group-hover:text-blue-500 transition-colors"></i>
                            <p class="text-sm text-gray-500">Click to upload or drag and drop</p>
                            <p class="text-xs text-gray-400">PNG, JPG, GIF up to 10MB</p>
                        </div>

                        <div id="filePreview" class="hidden relative z-20">
                            <img id="previewImg" src="" alt="Preview" class="max-h-48 mx-auto rounded-lg shadow-sm">
                            <div class="mt-2 flex items-center justify-center gap-2">
                                <span class="text-sm text-gray-600 truncate max-w-[200px]" id="fileName"></span>
                                <button type="button" id="removeFileBtn" class="text-red-500 hover:text-red-700 text-sm font-medium px-2 py-1 rounded hover:bg-red-50 transition-colors">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Content Description</label>
                    <textarea id="content" rows="3" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="Enter ad details..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Valid until</label>
                    <input type="datetime-local" id="valid"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div id="messageArea" class="hidden p-3 rounded-lg text-sm text-center"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
                    <span>Publish Ad</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('adForm');
        const fileInput = document.getElementById('imageInput');
        const submitBtn = document.getElementById('submitBtn');
        const messageArea = document.getElementById('messageArea');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const filePreview = document.getElementById('filePreview');
        const previewImg = document.getElementById('previewImg');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const baseUrl = 'https://jomc.pythonanywhere.com';

        // Drag and Drop Logic
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                
                // Validate Image
                if (!file.type.startsWith('image/')) {
                    showMessage('Please upload an image file.', 'error');
                    return;
                }

                // Update input files if necessary (for drag drop)
                if (fileInput.files !== files) {
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    fileInput.files = dataTransfer.files;
                }

                fileNameDisplay.textContent = file.name;
                
                // Preview Image
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    uploadPlaceholder.classList.add('hidden');
                    filePreview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        removeFileBtn.addEventListener('click', (e) => {
            e.preventDefault(); // Prevent form submit
            fileInput.value = '';
            previewImg.src = '';
            uploadPlaceholder.classList.remove('hidden');
            filePreview.classList.add('hidden');
        });

        const showMessage = (msg, type) => {
            messageArea.textContent = msg;
            messageArea.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (type === 'error') {
                messageArea.classList.add('bg-red-100', 'text-red-700');
            } else {
                messageArea.classList.add('bg-green-100', 'text-green-700');
            }
        };

        const setLoading = (isLoading) => {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="loader"></div><span>Processing...</span>';
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Publish Ad</span>';
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        };

        const uploadImage = async (file) => {
            const formData = new FormData();
            formData.append('image', file);

            try {

                const response = await fetch('https://vidupload.onrender.com/upload-image', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(`Upload failed: ${response.statusText}`);
                
                const text = await response.text();
                let data;
                
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    if (text.startsWith('http')) {
                        return text.trim();
                    }
                    console.error('Failed to parse response:', text);
                    throw new Error('Invalid server response');
                }

                return data.url || data.image_url || data.link; 
            } catch (error) {
                console.error(error);
                throw new Error('Failed to upload image. Please try again.');
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            messageArea.classList.add('hidden');

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const valid = document.getElementById('valid').value;
            const file = fileInput.files[0];

            try {
                if (!file) throw new Error('Please select an image');

                 const imageUrl = await uploadImage(file);

                const payload = {
                    title: title,
                    image_url: imageUrl,
                    content: content,
                    valid: new Date(valid).toISOString().replace('Z', '+00:00')
                };

                const adResponse = await fetch(`${baseUrl}/add_ad`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await adResponse.json();

                if (!adResponse.ok) {
                    throw new Error(result.error || 'Failed to save ad');
                }

                showMessage('Ad published successfully!', 'success');
                form.reset();
                // Reset Preview
                fileInput.value = '';
                previewImg.src = '';
                uploadPlaceholder.classList.remove('hidden');
                filePreview.classList.add('hidden');
                dropZone.classList.remove('border-blue-500', 'bg-blue-50');

            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                setLoading(false);
            }
        });
        document.addEventListener('DOMContentLoaded', ()=>{
            async function  pingUpload(){
            fetch('https://vidupload.onrender.com')
            .then(res = await res.json())
            if(data.pinged){
              console.log('ping success')
            } else{
              alert('We might be experiencing some issues with our upload images server. Your ad may not be submitted')
            }
          }
           pingUpload()
          
          })
    </script>
</body>
</html>
