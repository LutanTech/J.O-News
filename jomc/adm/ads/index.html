<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ads Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-exit { opacity: 1; }
        .modal-exit-active { opacity: 0; transform: scale(0.9); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <i class="fas fa-ad"></i>
                    </div>
                    <span class="font-bold text-xl text-gray-900">AdManager</span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="loadAds()" class="p-2 text-gray-400 hover:text-blue-600 transition-colors" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                        A
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Campaigns</h1>
                <p class="text-sm text-gray-500 mt-1">Manage your active and inactive advertisements</p>
            </div>
            <div class="flex gap-3 w-full sm:w-auto">
                <select id="typeFilter" onchange="loadAds()" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value="">All Types</option>
                    <option value="int">Interstitial</option>
                    <option value="banner">Banner</option>
                    <option value="popup">Popup</option>
                </select>
                <button onclick="openModal()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-sm font-medium transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> New Ad
                </button>
            </div>
        </div>

        <div id="adsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full flex justify-center py-12">
                <div class="loader w-10 h-10 border-4 border-t-blue-600"></div>
            </div>
        </div>

        <div id="emptyState" class="hidden text-center py-16">
            <div class="inline-block p-4 rounded-full bg-gray-100 mb-4">
                <i class="fas fa-folder-open text-4xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900">No advertisements found</h3>
            <p class="text-gray-500 mt-1">Create a new ad to get started.</p>
        </div>
    </main>

    <div id="adModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity backdrop-blur-sm" onclick="closeModal()"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex justify-between items-center mb-5">
                        <h3 class="text-lg leading-6 font-bold text-gray-900" id="modal-title">Create Advertisement</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <form id="adForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Creative</label>
                            <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition-colors cursor-pointer group" id="dropZone">
                                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                
                                <div id="uploadPlaceholder" class="space-y-1 py-4">
                                    <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 group-hover:text-blue-500"></i>
                                    <p class="text-xs text-gray-500 font-medium">Click or drop image</p>
                                </div>

                                <div id="filePreview" class="hidden relative z-20">
                                    <img id="previewImg" src="" class="h-32 mx-auto rounded object-contain shadow-sm">
                                    <button type="button" onclick="clearImage()" class="absolute -top-2 -right-2 bg-white rounded-full p-1 shadow-md text-red-500 hover:text-red-700">
                                        <i class="fas fa-times-circle"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                <input type="text" id="title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm" placeholder="Campaign Title">
                            </div>
                            
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Content / URL</label>
                                <textarea id="content" rows="2" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm" placeholder="Ad description or target URL"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Valid until</label>
                                <input type="datetime-local" id="valid" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            </div>
                        </div>

                        <div id="messageArea" class="hidden p-2 rounded text-xs text-center font-medium"></div>

                        <div class="mt-5 sm:mt-6">
                            <button type="submit" id="submitBtn" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-3 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:text-sm transition-all">
                                <span>Publish Campaign</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <template id="adCardTemplate">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow group flex flex-col h-full">
            <div class="relative h-40 bg-gray-100 overflow-hidden">
                <img src="" alt="Ad Creative" class="ad-image w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute top-2 right-2 flex gap-1">
                    <span class="ad-type badge bg-black/50 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wide"></span>
                </div>
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3">
                     <h3 class="ad-title text-white font-semibold truncate text-sm"></h3>
                </div>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center text-xs text-gray-500 gap-1">
                            <i class="fas fa-eye text-blue-500"></i>
                            <span class="ad-seen font-medium"></span>
                        </div>
                        <span class="ad-status text-[10px] font-bold px-2 py-0.5 rounded-full border"></span>
                    </div>
                    <p class="ad-content text-xs text-gray-500 line-clamp-2 mb-3 h-8"></p>
                </div>
                
                <div class="flex items-center justify-between pt-3 border-t border-gray-100 mt-2">
                    <span class="ad-date text-[10px] text-gray-400"></span>
                    <button class="delete-btn text-red-500 hover:text-red-700 p-1.5 hover:bg-red-50 rounded transition-colors" title="Delete Ad">
                        <i class="far fa-trash-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script>
        const baseUrl = 'https://jomc.pythonanywhere.com';
        let currentAds = [];

        const adsGrid = document.getElementById('adsGrid');
        const emptyState = document.getElementById('emptyState');
        const adModal = document.getElementById('adModal');
        const adForm = document.getElementById('adForm');
        const fileInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const previewImg = document.getElementById('previewImg');
        const typeFilter = document.getElementById('typeFilter');

        document.addEventListener('DOMContentLoaded', loadAds);

        async function loadAds() {
            adsGrid.innerHTML = '<div class="col-span-full flex justify-center py-12"><div class="loader border-t-blue-600"></div></div>';
            emptyState.classList.add('hidden');
            
            const filter = typeFilter.value;
            const url = filter ? `${baseUrl}/admin/ads?filter=${filter}` : `${baseUrl}/admin/ads`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (res.ok && data.ads) {
                    currentAds = data.ads;
                    renderAds(data.ads);
                } else {
                    throw new Error(data.error || 'Failed to fetch ads');
                }
            } catch (error) {
                console.error(error);
                adsGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-8"><i class="fas fa-exclamation-circle mr-2"></i>Error: ${error.message}</div>`;
            }
        }

        function renderAds(ads) {
            adsGrid.innerHTML = '';
            
            if (ads.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            const template = document.getElementById('adCardTemplate');

            ads.forEach(ad => {
                const clone = template.content.cloneNode(true);
                
                clone.querySelector('.ad-image').src = ad.image_url || 'https://via.placeholder.com/400x200?text=No+Image';
                clone.querySelector('.ad-image').onerror = function() { this.src = 'https://via.placeholder.com/400x200?text=Error'; };
                clone.querySelector('.ad-title').textContent = ad.title;
                clone.querySelector('.ad-content').textContent = ad.content || 'No content provided';
                clone.querySelector('.ad-seen').textContent = (ad.seen || 0).toLocaleString();
                clone.querySelector('.ad-type').textContent = ad.type || 'int';
                
                const validDate = new Date(ad.valid);
                const isExpired = new Date() > validDate;
                
                const statusBadge = clone.querySelector('.ad-status');
                if (isExpired) {
                    statusBadge.textContent = 'EXPIRED';
                    statusBadge.className = 'ad-status text-[10px] font-bold px-2 py-0.5 rounded-full border bg-gray-100 text-gray-500 border-gray-200';
                } else {
                    statusBadge.textContent = 'ACTIVE';
                    statusBadge.className = 'ad-status text-[10px] font-bold px-2 py-0.5 rounded-full border bg-green-50 text-green-600 border-green-200';
                }

                clone.querySelector('.ad-date').textContent = `Ends: ${validDate.toLocaleDateString()}`;

                const deleteBtn = clone.querySelector('.delete-btn');
                deleteBtn.onclick = () => deleteAd(ad.id);

                adsGrid.appendChild(clone);
            });
        }

        async function deleteAd(id) {
            if(!confirm('Are you sure you want to delete this ad?')) return;

            try {
                const res = await fetch(`${baseUrl}/delete_ad?id=${id}`);
                const data = await res.json();
                
                if (res.ok) {
                    loadAds(); 
                } else {
                    alert(data.error || 'Failed to delete');
                }
            } catch (error) {
                alert('Network error while deleting');
            }
        }

        function openModal() {
            adModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            adModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            adForm.reset();
            clearImage();
            showMessage('');
        }

        function clearImage() {
            fileInput.value = '';
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('filePreview').classList.add('hidden');
            previewImg.src = '';
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (!file.type.startsWith('image/')) return alert('Images only');
                
                if (fileInput.files !== files) {
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    fileInput.files = dt.files;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('filePreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        const uploadImage = async (file) => {
            const formData = new FormData();
            formData.append('file', file);
            
            const res = await fetch('https://vidupload.onrender.com/upload-image', { method: 'POST', body: formData });
            if (!res.ok) throw new Error('Image upload failed');
            
            const text = await res.text();
            try { return JSON.parse(text).url || JSON.parse(text).link; } 
            catch { return text.startsWith('http') ? text.trim() : null; }
        };

        adForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-5 h-5 border-t-white"></div>';
            showMessage('');

            try {
                const file = fileInput.files[0];
                if (!file) throw new Error('Please select an image');

                const imageUrl = await uploadImage(file);
                if (!imageUrl) throw new Error('Invalid response from image server');

                const validDays = parseInt(document.getElementById('valid').value);
                const date = new Date();
                date.setDate(date.getDate() + validDays);
                const validISO = date.toISOString(); 

                const payload = {
                    title: document.getElementById('title').value,
                    content: document.getElementById('content').value,
                    image_url: imageUrl,
                    valid: validISO 
                };

                const res = await fetch(`${baseUrl}/add_ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (res.ok) {
                    closeModal();
                    loadAds(); 
                } else {
                    throw new Error(data.error || 'Failed to save ad');
                }
            } catch (error) {
                showMessage(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        });

        function showMessage(msg, type = 'neutral') {
            const el = document.getElementById('messageArea');
            if (!msg) {
                el.classList.add('hidden');
                return;
            }
            el.textContent = msg;
            el.className = `p-3 rounded text-sm text-center font-medium mb-4 ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
