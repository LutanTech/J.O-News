<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMC Admin Panel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            750: '#2d3748', // Custom dark shade
                            850: '#1a202c',
                            950: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Smooth transitions */
        .transition-all-300 { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- App content injected by JS -->
    </div>

    <script>
        // --- Constants & State ---
        const API_BASE = "https://jomc.pythonanywhere.com";
        
        let state = {
            auth: JSON.parse(localStorage.getItem('admin_auth')) || { isAuthenticated: false, adminId: '', token: '', user: null },
            view: 'dashboard',
            darkMode: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches),
            sidebarOpen: true,
            data: { users: [], articles: [], comments: [], logs: [] },
            filters: { search: '', logType: '' },
            loading: false
        };

        // --- Core Functions ---

        function init() {
            applyTheme();
            render();
        }

        function setState(newState) {
            state = { ...state, ...newState };
            render();
        }

        function applyTheme() {
            const html = document.documentElement;
            if (state.darkMode) {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            applyTheme();
            // Re-render chart if on dashboard to update colors
            if(state.view === 'dashboard' && state.auth.isAuthenticated) renderDashboardCharts();
        }

        // --- API Interactions ---

        async function login(email, password) {
            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok && data.token) {
                    const authData = { 
                        isAuthenticated: true, 
                        adminId: data.user.id, 
                        token: data.token,
                        user: data.user
                    };
                    localStorage.setItem('admin_auth', JSON.stringify(authData));
                    setState({ auth: authData, view: 'dashboard' });
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                alert('Connection error. Is the Flask backend running?');
                console.error(err);
            }
        }

        function logout() {
            localStorage.removeItem('admin_auth');
            setState({ auth: { isAuthenticated: false }, view: 'dashboard', data: { users: [], articles: [], comments: [], logs: [] } });
        }

        async function fetchData(endpoint) {
            const { adminId, token } = state.auth;
            // Add auth params to URL if not logs (logs are public in your code currently, but good practice to keep consistent)
            const separator = endpoint.includes('?') ? '&' : '?';
            const url = endpoint.includes('logs') 
                ? `${API_BASE}/${endpoint}` 
                : `${API_BASE}/${endpoint}${separator}id=${adminId}&token=${token}`;
                
            const res = await fetch(url);
            return res.json();
        }

        async function loadDashboardData() {
            setState({ loading: true });
            try {
                const [users, articles, comments, logs] = await Promise.all([
                    fetchData('admin/users'),
                    fetchData('admin/articles'),
                    fetchData('admin/comments'),
                    fetchData('admin/logs')
                ]);
                
                setState({ 
                    loading: false, 
                    data: { 
                        users: users.users || [], 
                        articles: articles.articles || [], 
                        comments: comments.comments || [], 
                        logs: logs.logs || [] 
                    } 
                });
                
                // Initialize charts after DOM update
                setTimeout(renderDashboardCharts, 100);
            } catch (e) {
                console.error(e);
                setState({ loading: false });
            }
        }

        async function deleteItem(type, id) {
            if (!confirm(`Permanently delete this ${type}?`)) return;
            
            const endpoints = {
                user: 'admin/delete_user',
                article: 'admin/delete_article',
                comment: 'admin/delete_comment'
            };
            
            const idFields = {
                user: 'target_id',
                article: 'article_id',
                comment: 'comment_id'
            };

            try {
                const res = await fetch(`${API_BASE}/${endpoints[type]}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        admin_id: state.auth.adminId, 
                        token: state.auth.token, 
                        [idFields[type]]: id 
                    })
                });

                if (res.ok) {
                    // Optimistic update
                    const newData = { ...state.data };
                    if (type === 'user') newData.users = newData.users.filter(u => u.id !== id);
                    if (type === 'article') newData.articles = newData.articles.filter(a => a.id !== id);
                    if (type === 'comment') newData.comments = newData.comments.filter(c => c.id !== id);
                    setState({ data: newData });
                } else {
                    alert('Failed to delete item');
                }
            } catch (e) {
                alert('Error connecting to server');
            }
        }

        // --- Render Functions ---

        function render() {
            const app = document.getElementById('app');
            
            if (!state.auth.isAuthenticated) {
                app.innerHTML = renderLogin();
                // Attach Login Listener
                document.getElementById('loginForm')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    login(e.target.email.value, e.target.password.value);
                });
            } else {
                app.innerHTML = `
                    <div class="flex h-screen overflow-hidden">
                        ${renderSidebar()}
                        <div class="flex-1 flex flex-col min-w-0 transition-all duration-300 lg:ml-64 relative" id="main-content">
                            ${renderHeader()}
                            <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
                                ${state.loading ? renderLoading() : renderCurrentView()}
                            </main>
                        </div>
                    </div>
                `;
                
                // Attach global listeners
                attachGlobalListeners();
            }
            
            // Initialize Icons
            lucide.createIcons();
        }

        function renderLoading() {
            return `<div class="flex items-center justify-center h-full"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div></div>`;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                     <button onclick="toggleTheme()" class="absolute top-6 right-6 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                        <i data-lucide="${state.darkMode ? 'sun' : 'moon'}"></i>
                    </button>
                    <div class="w-full max-w-md p-8 rounded-2xl shadow-xl border bg-white dark:bg-slate-800 dark:border-slate-700 border-gray-100">
                        <div class="flex flex-col items-center mb-8">
                            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-blue-600/30">
                                <i data-lucide="shield" class="text-white h-8 w-8"></i>
                            </div>
                            <h2 class="text-3xl font-bold">Welcome Back</h2>
                            <p class="text-sm opacity-60 mt-2">Enter credentials to access admin panel</p>
                        </div>
                        <form id="loginForm" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium mb-2 opacity-80">Email Address</label>
                                <input name="email" type="email" required placeholder="admin@example.com" class="w-full px-4 py-3 rounded-xl border bg-gray-50 dark:bg-slate-900 border-gray-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2 opacity-80">Password</label>
                                <input name="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border bg-gray-50 dark:bg-slate-900 border-gray-200 dark:border-slate-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all transform hover:-translate-y-0.5">
                                Sign In
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderSidebar() {
            const items = [
                { id: 'dashboard', icon: 'bar-chart-3', label: 'Overview' },
                { id: 'users', icon: 'users', label: 'Users' },
                { id: 'articles', icon: 'file-text', label: 'Articles' },
                { id: 'comments', icon: 'message-square', label: 'Comments' },
                { id: 'logs', icon: 'activity', label: 'System Logs' },
                { id: 'refresh', icon: 'refresh', label: 'Refresh' }
            ];

            const navHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" 
                    class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 mb-1 ${state.view === item.id ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'text-slate-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700/50'}">
                    <i data-lucide="${item.icon}" class="w-5 h-5 mr-3"></i>
                    ${item.label}
                </button>
            `).join('');

            return `
                <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 transform ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-transform duration-300">
                    <div class="h-16 flex items-center justify-between px-6 border-b border-opacity-10 dark:border-slate-700">
                        <div class="flex items-center space-x-2">
                            <div class="bg-blue-600 p-1.5 rounded-lg"><i data-lucide="shield" class="text-white w-4 h-4"></i></div>
                            <span class="text-lg font-bold tracking-tight">Admin<span class="text-blue-500">Panel</span></span>
                        </div>
                        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <nav class="p-4">${navHTML}</nav>
                    <div class="absolute bottom-0 w-full p-4 border-t border-opacity-10 dark:border-slate-700">
                        <div class="flex items-center p-3 mb-3 rounded-lg bg-gray-100 dark:bg-slate-900/50">
                            <img src="${state.auth.user?.pic || 'https://api.dicebear.com/7.x/avataaars/svg'}" class="w-8 h-8 rounded-full mr-3 bg-gray-300">
                            <div class="overflow-hidden">
                                <p class="text-sm font-medium truncate">${state.auth.user?.username || 'Admin'}</p>
                                <p class="text-xs opacity-60 truncate">${state.auth.user?.email}</p>
                            </div>
                        </div>
                        <button onclick="logout()" class="flex items-center w-full px-4 py-2 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">
                            <i data-lucide="log-out" class="w-4 h-4 mr-3"></i> Sign Out
                        </button>
                    </div>
                </aside>
            `;
        }

        function renderHeader() {
            return `
                <header class="h-16 flex items-center justify-between px-4 lg:px-8 border-b dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm sticky top-0 z-40">
                    <div class="flex items-center">
                        <button onclick="toggleSidebar()" class="lg:hidden mr-4 p-2 rounded-md hover:bg-gray-100 dark:hover:bg-slate-700"><i data-lucide="menu" class="w-5 h-5"></i></button>
                        <h1 class="text-xl font-semibold capitalize">${state.view}</h1>
                    </div>
                    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700 text-slate-600 dark:text-yellow-400">
                        <i data-lucide="${state.darkMode ? 'moon' : 'sun'}" class="w-5 h-5"></i>
                    </button>
                </header>
            `;
        }

        function renderCurrentView() {
            switch(state.view) {
                case 'dashboard': return renderDashboard();
                case 'users': return renderUsers();
                case 'articles': return renderArticles();
                case 'comments': return renderComments();
                case 'logs': return renderLogs();
                default: return renderDashboard();
            }
        }

        // --- View Implementations ---

        function renderDashboard() {
            const { users, articles, comments, logs } = state.data;
            const stats = [
                { title: 'Total Users', value: users.length, icon: 'users', color: 'text-blue-500', bg: 'bg-blue-50 dark:bg-blue-500/10' },
                { title: 'Articles', value: articles.length, icon: 'file-text', color: 'text-emerald-500', bg: 'bg-emerald-50 dark:bg-emerald-500/10' },
                { title: 'Comments', value: comments.length, icon: 'message-square', color: 'text-purple-500', bg: 'bg-purple-50 dark:bg-purple-500/10' },
                { title: 'Events', value: logs.length, icon: 'activity', color: 'text-amber-500', bg: 'bg-amber-50 dark:bg-amber-500/10' }
            ];

            return `
                <div class="space-y-6">
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${stats.map(s => `
                            <div class="p-6 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm hover:shadow-md transition-shadow">
                                <div class="flex items-center justify-between mb-4">
                                    <div class="p-3 rounded-xl ${s.bg} ${s.color}"><i data-lucide="${s.icon}" class="w-6 h-6"></i></div>
                                </div>
                                <h3 class="text-3xl font-bold mb-1">${s.value}</h3>
                                <p class="text-sm opacity-60">${s.title}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Charts Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="p-6 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800" style="max-height;500px">
                            <h3 class="text-lg font-bold mb-4">Top Articles by Views</h3>
                            <canvas id="viewsChart" class="w-full h-64" style="max-height:400px"></canvas>
                        </div>
                        <div class="p-6 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800">
                            <h3 class="text-lg font-bold mb-4">Categories Distribution</h3>
                            <div class="h-64 flex justify-center">
                                <canvas id="categoryChart" style="max-height:400px"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUsers() {
            const filtered = state.data.users.filter(u => 
                (u.name || '').toLowerCase().includes(state.filters.search.toLowerCase()) || 
                (u.email || '').toLowerCase().includes(state.filters.search.toLowerCase())
            );

            return `
                <div class="space-y-4">
                    <div class="flex justify-between gap-4">
                        <div class="relative flex-1 max-w-md">
                            <i data-lucide="search" class="absolute left-3 top-3 opacity-40 w-5 h-5"></i>
                            <input type="text" placeholder="Search users..." value="${state.filters.search}" oninput="updateSearch(this.value)" 
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-50 dark:bg-slate-900/50 text-xs uppercase opacity-70">
                                    <tr>
                                        <th class="p-4">User</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Level</th>
                                        <th class="p-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
                                    ${filtered.map(u => `
                                        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30">
                                            <td class="p-4">
                                                <div class="flex items-center">
                                                    <img src="${u.pic}" class="w-10 h-10 rounded-full mr-3 bg-gray-200 object-cover">
                                                    <div>
                                                        <div class="font-medium text-sm">${u.name || u.username}</div>
                                                        <div class="text-xs opacity-60">${u.email}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="p-4"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${u.is_active ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-400' : 'bg-red-100 text-red-700'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
                                            <td class="p-4 text-sm">${u.level}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="deleteItem('user', '${u.id}')" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderArticles() {
            const filtered = state.data.articles.filter(a => a.title.toLowerCase().includes(state.filters.search.toLowerCase()));

            return `
                 <div class="space-y-4">
                    <div class="relative flex-1 max-w-md">
                        <i data-lucide="search" class="absolute left-3 top-3 opacity-40 w-5 h-5"></i>
                        <input type="text" placeholder="Search articles..." value="${state.filters.search}" oninput="updateSearch(this.value); this.focus()" 
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 outline-none">
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-gray-50 dark:bg-slate-900/50 text-xs uppercase opacity-70">
                                    <tr><th class="p-4">Article</th><th class="p-4">Category</th><th class="p-4">Stats</th><th class="p-4 text-right">Action</th></tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
                                    ${filtered.map(a => `
                                        <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30 cursor-pointer" onclick="window.open('${window,location.origin + '/open/?s=' + a.slug}', '_blank')">
                                            <td class="p-4 max-w-xs">
                                                <div class="flex items-center">
                                                    ${a.image_url ? `<img src="${a.image_url}" class="w-12 h-8 object-cover rounded mr-3">` : ''}
                                                    <span class="text-sm font-medium line-clamp-1">${a.title}</span>
                                                </div>
                                            </td>
                                            <td class="p-4"><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-400">${a.categ}</span></td>
                                            <td class="p-4 text-xs opacity-70">Views: ${a.views} | Likes: ${a.likes}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="deleteItem('article', '${a.id}')" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                 </div>
            `;
        }

        function renderComments() {
             return `
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 dark:bg-slate-900/50 text-xs uppercase opacity-70">
                            <tr><th class="p-4">User</th><th class="p-4">Content</th><th class="p-4">Date</th><th class="p-4 text-right">Action</th></tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
                            ${state.data.comments.map(c => `
                                <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30">
                                    <td class="p-4 text-sm font-medium">${c.user}</td>
                                    <td class="p-4 text-sm opacity-80 max-w-md truncate">${c.content}</td>
                                    <td class="p-4 text-xs opacity-60">${new Date(c.at).toLocaleDateString()}</td>
                                    <td class="p-4 text-right">
                                        <button onclick="deleteItem('comment', '${c.id}')" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderLogs() {
            const logs = state.filters.logType 
                ? state.data.logs.filter(l => l.type === state.filters.logType) 
                : state.data.logs;

            return `
                <div class="space-y-4">
                    <div class="flex gap-2">
                        ${['', 'success', 'error', 'info'].map(t => `
                            <button onclick="filterLogs('${t}')" class="px-4 py-2 rounded-lg text-sm font-medium border transition-colors ${state.filters.logType === t ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-slate-800 border-gray-200 dark:border-slate-700'}">
                                ${t === '' ? 'All Logs' : t.charAt(0).toUpperCase() + t.slice(1)}
                            </button>
                        `).join('')}
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 overflow-hidden">
                        <table class="w-full text-left font-mono text-sm">
                            <thead class="bg-gray-50 dark:bg-slate-900/50 text-xs uppercase opacity-70">
                                <tr><th class="p-4">Type</th><th class="p-4">Message</th><th class="p-4">Time</th></tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 dark:divide-slate-700">
                                ${logs.map(l => `
                                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-700/30">
                                        <td class="p-4">
                                            <span class="px-2 py-0.5 rounded-full text-xs font-bold ${l.type === 'error' ? 'bg-red-100 text-red-700' : l.type === 'success' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}">${l.type}</span>
                                        </td>
                                        <td class="p-4">${l.content} <span class="block text-xs opacity-50 mt-1">${l.info || ''}</span></td>
                                        <td class="p-4 opacity-60 text-xs">${new Date(l.at).toLocaleString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- Interaction Helpers ---

        function attachGlobalListeners() {
            // Re-bind Lucide icons for injected content
            lucide.createIcons();
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('aside');
            const main = document.getElementById('main-content');
            
            state.sidebarOpen = !state.sidebarOpen;
            
            if (state.sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                main.classList.add('lg:ml-64');
            } else {
                sidebar.classList.add('-translate-x-full');
                main.classList.remove('lg:ml-64');
            }
        }

        async function navigate(viewId) {
            state.view = viewId;
            state.filters = { search: '', logType: '' }; // Reset filters
            
            // Re-render main content container
            const main = document.querySelector('main');
            main.innerHTML = renderLoading();
            
            // Update sidebar active state (visual only)
            render(); 

            // Refresh data if needed
            if (viewId === 'dashboard' || viewId == 'refresh') {
              await loadDashboardData();
            } else {
                main.innerHTML = renderCurrentView();
                lucide.createIcons();
            }
        }

        function updateSearch(val) {
            state.filters.search = val;
            const main = document.querySelector('main');
            main.innerHTML = renderCurrentView();
            lucide.createIcons();
        }

        function filterLogs(type) {
            state.filters.logType = type;
            const main = document.querySelector('main');
            main.innerHTML = renderCurrentView();
            lucide.createIcons();
        }

        // --- Charts Logic ---

        let viewsChartInstance = null;
        let categoryChartInstance = null;

        function renderDashboardCharts() {
            const ctxViews = document.getElementById('viewsChart');
            const ctxCat = document.getElementById('categoryChart');
            
            if (!ctxViews || !ctxCat) return;

            const isDark = state.darkMode;
            const gridColor = isDark ? '#374151' : '#e5e7eb';
            const textColor = isDark ? '#9ca3af' : '#4b5563';

            // Prepare Data
            const articles = [...state.data.articles].sort((a,b) => b.views - a.views).slice(0, 10);
            const categories = {};
            state.data.articles.forEach(a => categories[a.categ] = (categories[a.categ] || 0) + 1);

            // Destroy old instances
            if (viewsChartInstance) viewsChartInstance.destroy();
            if (categoryChartInstance) categoryChartInstance.destroy();

            // Views Chart
            viewsChartInstance = new Chart(ctxViews, {
                type: 'bar',
                data: {
                    labels: articles.map(a => a.id ),
                    datasets: [{
                        label: 'Views',
                        data: articles.map(a => a.views),
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: gridColor }, ticks: { color: textColor } },
                        x: { grid: { display: false }, ticks: { color: textColor } }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Category Chart
            categoryChartInstance = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categories),
                    datasets: [{
                        data: Object.values(categories),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: textColor } }
                    }
                }
            });
        }

        // Start App
        init();
        
        // Load initial data if logged in
        if (state.auth.isAuthenticated) {
            loadDashboardData();
        }

    </script>
</body>
</html>
