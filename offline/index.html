<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<title>JOMC News Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter;} 
  body{
    background:#000000;color:white;
    min-height:100dvh;display:flex;flex-direction:column;
    margin: auto;
    pointer-events: none !important;
    user-select: none !important;
  }
  button{
    pointer-events: all !important;
  }
  header{
    display:flex;align-items:center;gap:10px;padding:14px;background:#000;border-bottom:1px solid rgba(255,255,255,.1);
    position:sticky;top:0;z-index:10;
  }
  header img{width:42px;border-radius:8px;}
  header span{font-size:1.3rem;font-weight:800;}
  .screen{
    flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:20px;
  }
  .skeleton-card{
    background:#141414;border-radius:14px;padding:18px;display:flex;gap:15px;animation:pulse 1.6s infinite;
  }
  .sk-img{
    width:70px;height:70px;border-radius:10px;background:#2a2a2a;
  }
  .sk-lines{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;}
  .line{
    height:12px;border-radius:6px;background:#2a2a2a;
  }
  .line.short{width:40%;}
  @keyframes pulse{
    0%{opacity:.7;}50%{opacity:1;}100%{opacity:.7;}
  }
  .offline-box{
    text-align:center;margin-top:15px;
  }
  .offline-box emoji{font-size:48px;display:block;margin-bottom:10px;}
  .offline-box h2{font-size:20px;font-weight:700;margin-bottom:5px;}
  .offline-box p{font-size:14px;opacity:.7;margin-bottom:15px;}
  button{
    width:100%;padding:12px;background:#e11d48;border:none;border-radius:10px;color:white;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .spin{
    width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top:3px solid white;border-radius:50%;animation:spin 1s linear infinite;display:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  #wifi-loader {
  --background: #62abff;
  --front-color: #29f086;

  height: 64px;
  border-radius: 50px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 50px auto;
}

#wifi-loader svg {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
}

#wifi-loader svg circle {
  position: absolute;
  fill: none;
  stroke-width: 6px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: rotate(-100deg);
  transform-origin: center;
}

#wifi-loader svg circle.back {
  stroke: var(--back-color);
}

#wifi-loader svg circle.front {
  stroke: var(--front-color);
}

#wifi-loader svg.circle-outer {
  height: 86px;
  width: 86px;
}

#wifi-loader svg.circle-outer circle {
  stroke-dasharray: 62.75 188.25;
}

#wifi-loader svg.circle-outer circle.back {
  animation: circle-outer135 1.8s ease infinite 0.3s;
}

#wifi-loader svg.circle-outer circle.front {
  animation: circle-outer135 1.8s ease infinite 0.15s;
}

#wifi-loader svg.circle-middle {
  height: 60px;
  width: 60px;
}

#wifi-loader svg.circle-middle circle {
  stroke-dasharray: 42.5 127.5;
}

#wifi-loader svg.circle-middle circle.back {
  animation: circle-middle6123 1.8s ease infinite 0.25s;
}

#wifi-loader svg.circle-middle circle.front {
  animation: circle-middle6123 1.8s ease infinite 0.1s;
}

#wifi-loader svg.circle-inner {
  height: 34px;
  width: 34px;
}

#wifi-loader svg.circle-inner circle {
  stroke-dasharray: 22 66;
}

#wifi-loader svg.circle-inner circle.back {
  animation: circle-inner162 1.8s ease infinite 0.2s;
}

#wifi-loader svg.circle-inner circle.front {
  animation: circle-inner162 1.8s ease infinite 0.05s;
}

#wifi-loader .text {
  position: absolute;
  bottom: -40px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-transform: lowercase;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.2px;
}

#wifi-loader .text::before, #wifi-loader .text::after {
  content: attr(data-text);
}

#wifi-loader .text::before {
  color: var(--text-color);
}

#wifi-loader .text::after {
  color: var(--front-color);
  animation: text-animation76 3.6s ease infinite;
  position: absolute;
  left: 0;
}

    <p>Your vibe disconnected. Try again when network is stable.</p>

<footer style="text-align: center; color: grey; font-style: italic; font-family: Arial, Helvetica, sans-serif; font-size: small; margin: 10px 0;">&copy; <span id="yr"></span> JOMC News. All Rights Reserved</footer>
<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    document.querySelector('#yr').textContent = new Date().getFullYear()
  })
  const btn = document.getElementById("btn");
  const t = document.getElementById("t");
  const sp = document.getElementById("sp");

  // retry counter
  let retries = parseInt(localStorage.getItem("retries")) || 0;

  // BTN CLICK
  btn.onclick = () => {
    // when retries already maxed, don’t attempt
    if (retries >= 3) {
      console.log("Retry limit reached, not trying again");
      t.textContent = "Still offline";
      sp.style.display = "none";
      return;
    }

    t.textContent = "Checking...";
    sp.style.display = "block";
    btn.disabled = true;

    retries++;
    localStorage.setItem("retries", retries);

    setTimeout(() => location.reload(), 900);
  };

  // ON PAGE LOAD
  document.addEventListener("DOMContentLoaded", () => {


    // If offline + retries >=3, stop trying
    if (retries >= 3) {
      console.log("Stopped auto retries, user must wait for network");
      btn.disabled = false;
      t.textContent = "Retry";
      sp.style.display = "none";
    }
  });
</script>
